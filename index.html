<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المركز الألماني لقطع غيار BMW</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f8; color: #333; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 22px; color: #1a1a1a; }
        .search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 15px; outline: none; background: #fff; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .card { background: #ffffff; border-radius: 12px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #e2e8f0; }
        .card h3 { margin: 0 0 6px 0; font-size: 17px; color: #1e293b; }
        .code { font-size: 13px; color: #64748b; margin: 0 0 6px 0; font-family: monospace; }
        .price { font-size: 15px; color: #16a34a; font-weight: bold; margin: 0 0 4px 0; }
        .stock { font-size: 14px; color: #0284c7; font-weight: bold; margin-bottom: 10px; }
        .stock.out { color: #dc2626; }
        .btn { background-color: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; text-decoration: none; display: block; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <h1>المركز الألماني لقطع غيار BMW</h1>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم القطعة أو الكود..." onkeyup="filterProducts()">
    <div class="grid" id="productGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDAtgcGVa_yuy-IMA02...", 
            authDomain: "bmw-parts-b99e1.firebaseapp.com",
            projectId: "bmw-parts-b99e1",
            storageBucket: "bmw-parts-b99e1.appspot.com",
            messagingSenderId: "854628460870",
            appId: "1:854628460870:web:79f24...",
            measurementId: "G-BB9G5JVSB1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const productsCol = collection(db, "products");
        const phoneNumber = "201033241788"; 
        let products = [];

        onSnapshot(productsCol, (snapshot) => {
            products = [];
            snapshot.forEach((docSnap) => {
                products.push({ id: docSnap.id, ...docSnap.data() });
            });
            displayProducts(products);
        });

        window.displayProducts = function(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#888;">جاري التحميل أو لا توجد قطع مطابقة...</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                const isOutOfStock = product.stock <= 0;
                
                card.innerHTML = `
                    <div>
                        <h3>${product.name}</h3>
                        <div class="code">الكود: ${product.code}</div>
                        <div class="price">السعر: ${product.price} جنيه</div>
                        <div class="stock ${isOutOfStock ? 'out' : ''}">
‎                            الحالة: ${isOutOfStock ? 'غير متوفر حالياً' : 'متوفر بالمخزن'}
                        </div>
                    </div>
                    <button class="btn" onclick="orderViaWhatsApp('${product.name}', '${product.code}', '${product.price}')">طلب عبر واتساب</button>
                `;
                grid.appendChild(card);
            });
        };

        window.filterProducts = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.code.toLowerCase().includes(query)
            );
            displayProducts(filtered);
        };

        window.orderViaWhatsApp = function(name, code, price) {
            const message = encodeURIComponent(`مرحباً، أود الاستفسار عن القطعة:\n- القطعة: ${name}\n- الكود: ${code}\n- السعر: ${price} جنيه`);
            window.location.href = `https://wa.me/${phoneNumber}?text=${message}`;
        };
    </script>
</body>
</html>
